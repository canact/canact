# Rewrite canact/scoop-bucket from a published GitHub Release.
# The automatic path is publish-scoop-bucket in release.yml.
# Use this workflow to re-sync after a missed push or to verify the PAT.
name: Publish Scoop bucket

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Semver without tag prefix (e.g. 0.1.1). Leave empty to use the
          latest GitHub Release tag (strip a leading v).
        required: false
        type: string
        default: ""

concurrency:
  group: publish-scoop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Update scoop-bucket
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout canact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: canact

      - name: Checkout scoop-bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: canact/scoop-bucket
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
          path: scoop-bucket

      - name: Resolve version and download SHA256 files
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
            tag="v${version}"
          else
            tag=$(gh release view --repo canact/canact --json tagName --jq .tag_name)
            version="${tag#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${version} tag=${tag}"
          mkdir -p artifacts
          gh release download "${tag}" \
            --repo canact/canact \
            --pattern "canact-x86_64-pc-windows-msvc.zip.sha256" \
            --dir artifacts
          ls -la artifacts

      - name: Update and push Scoop manifest
        working-directory: scoop-bucket
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python3 ../canact/scripts/update-scoop-manifest.py \
            --version "${VERSION}" \
            --artifacts-dir ../artifacts \
            --output bucket/canact.json
          git config user.name "${GITHUB_USER}"
          git config user.email "${GITHUB_EMAIL}"
          git add bucket/canact.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already at ${VERSION}; nothing to commit"
            exit 0
          fi
          git commit -m "canact ${VERSION}"
          git push
