name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  # Cheap status check. cancel-in-progress can drop the current SHA
  # when release-please force-pushes twice (canact #162).
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Semantic PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
