# Cheap re-apply of docs/releases/<tag>.md onto a GitHub Release.
# Does not compile and does not start cargo-dist. Use after landing
# or editing a notes file, or when host already finished with auto notes.
name: Apply release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2)"
        required: true
        type: string

concurrency:
  group: apply-release-notes-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply curated notes
        run: bash scripts/apply-release-notes.sh
