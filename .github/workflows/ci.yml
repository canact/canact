name: CI

on:
  pull_request:
  merge_group: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  stealth:
    name: Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert launch surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/assert-launch.sh canact/canact

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: target/ci-lint
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}
      - run: cargo fmt --check
      - name: Full clippy
        if: >-
          github.event_name != 'pull_request' ||
          !startsWith(github.head_ref, 'release-please')
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features runtime -- -D warnings
          cargo clippy --locked --all-targets --features cli -- -D warnings
      - name: Rustdoc
        if: >-
          github.event_name != 'pull_request' ||
          !startsWith(github.head_ref, 'release-please')
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Release-please check
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'release-please')
        run: |
          cargo check --locked --all-targets
          cargo check --locked --all-targets --features runtime
          cargo check --locked --all-targets --features cli
      - run: bash scripts/deny-check.sh
      - run: python3 scripts/test_fossa_filter.py
      - run: python3 scripts/test_update_scoop_manifest.py
      - run: python3 scripts/test_attach_release_signatures.py
      - run: python3 scripts/test_apply_release_notes.py
      - run: python3 scripts/test_workflow_triggers.py
      - run: python3 scripts/test_rerun_cancelled_pr_checks.py
      - run: python3 scripts/test_publish_crates.py
      - run: python3 scripts/test_sign_git_tag.py
      - run: python3 scripts/test_report_scheduled_failure.py
      - run: python3 scripts/test_stage_cyclonedx_sbom.py

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    env:
      CARGO_TARGET_DIR: target/ci-test
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        if: >-
          github.event_name != 'pull_request' ||
          !startsWith(github.head_ref, 'release-please')
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}
      - name: Unit and integration tests
        if: >-
          github.event_name != 'pull_request' ||
          !startsWith(github.head_ref, 'release-please')
        shell: bash
        run: |
          set -euo pipefail
          out="${CARGO_TARGET_DIR}/junit"
          mkdir -p "$out"
          # nextest writes junit.xml under workspace target/nextest, not CARGO_TARGET_DIR
          cargo nextest run --locked --profile ci
          cp target/nextest/ci/junit.xml "${out}/default.xml"
          cargo nextest run --locked --features runtime --profile ci
          cp target/nextest/ci/junit.xml "${out}/runtime.xml"
          cargo nextest run --locked --features cli --profile ci
          cp target/nextest/ci/junit.xml "${out}/cli.xml"
      - name: Doc tests
        if: >-
          github.event_name != 'pull_request' ||
          !startsWith(github.head_ref, 'release-please')
        # ProbeFinish doctests are behind feature runtime.
        run: cargo test --locked --doc --features runtime
      - name: Release-please check
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'release-please')
        run: |
          cargo check --locked --all-targets
          cargo check --locked --all-targets --features runtime
          cargo check --locked --all-targets --features cli
      - name: Test summary
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           !startsWith(github.head_ref, 'release-please'))
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: target/ci-test/junit/*.xml
          show: all

  test-gate:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - name: All OS tests passed
        run: test "${{ needs.test.result }}" = "success"

  fuzz:
    name: Fuzz smoke
    # Version-only release-please PRs already passed fuzz on the
    # feature PR. Skip the nightly compile here.
    if: >-
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target/ci-fuzz
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            fuzz
          shared-key: fuzz
          cache-on-failure: true
          save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}
      - name: Build fuzz targets
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Smoke-run fuzz targets
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cargo fuzz run fuzz_cache_json --target x86_64-unknown-linux-gnu -- -max_total_time=5
          cargo fuzz run fuzz_endpoint --target x86_64-unknown-linux-gnu -- -max_total_time=5
          cargo fuzz run fuzz_host_policy --target x86_64-unknown-linux-gnu -- -max_total_time=5

  workflow-sanity:
    name: Workflow sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows
          min-severity: high
          version: "1.30.0"
          advanced-security: "false"
          online-audits: "false"
