# Sign an existing GitHub Release with Cosign and SLSA provenance.
# Future tags also get a provenance job in release.yml after host.
# Dispatch this workflow to sign a tag that shipped before that job
# existed (v0.1.1) or to re-attach signatures after a failed upload.
name: Sign release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v0.1.1)"
        required: true
        type: string

concurrency:
  group: sign-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sign:
    name: Sign release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release assets
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" --repo "$REPO" --dir artifacts
          rm -f artifacts/*.sigstore.json artifacts/*.intoto.jsonl \
            artifacts/*.sig artifacts/*.asc
          ls -la artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and upload
        env:
          ARTIFACTS: artifacts
        run: bash scripts/attach-release-signatures.sh
