[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # wiremux-auth keyring 4.2 still uses zbus 5. These crates moved
    # into zbus 6 and have no upgrade that keeps this keyring release.
    # Remove when keyring no longer depends on them.
    # Scorecard reads osv-scanner.toml, not this file. Update both.
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus 6; keyring 4.2 stays on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus 6; keyring 4.2 stays on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus 6; keyring 4.2 stays on zbus 5" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
