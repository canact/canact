[package]
name = "canact"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Reserved."
keywords = []
categories = []
repository = "https://github.com/canact/canact"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
runtime = ["dep:tokio", "dep:futures", "dep:tracing"]
cli = ["runtime", "dep:clap", "openai", "dep:dirs"]
openai = ["dep:reqwest"]

[dependencies.clap]
version = "4"
optional = true
features = ["derive"]

[dependencies.dirs]
version = "6"
optional = true

[dependencies.reqwest]
version = "0.13"
optional = true
default-features = false
features = ["json", "stream", "rustls"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[[bin]]
name = "canact"
path = "src/bin/canact.rs"
required-features = ["cli"]

[[test]]
name = "cli_goldens"
path = "tests/cli_goldens/main.rs"
required-features = ["cli"]

[[test]]
name = "host_overlays"
path = "tests/host_overlays/main.rs"
required-features = ["cli"]

[[test]]
name = "mcp_stdio"
path = "tests/mcp_stdio.rs"
required-features = ["cli"]
