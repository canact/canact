[package]
name = "canact-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.canact]
path = ".."
default-features = false

[[bin]]
name = "fuzz_cache_json"
path = "fuzz_targets/fuzz_cache_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_endpoint"
path = "fuzz_targets/fuzz_endpoint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_host_policy"
path = "fuzz_targets/fuzz_host_policy.rs"
test = false
doc = false
bench = false
